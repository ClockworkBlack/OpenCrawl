[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrawl"
version = "1.0.0"
description = "A polite, resumable crawler for any list of websites, organizations or causes, with optional civic (government) and subject-research modules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# Floors are the releases that fixed known security issues in the libraries that parse untrusted input
# (requirements.txt pins the exact versions CI runs).
dependencies = [
  "requests>=2.32.4",
  "urllib3>=2.6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.3.0",
  "PyYAML>=6.0.1",
  "Pillow>=13.0.0",
  "pdfplumber>=0.11.8",
  "pdfminer.six>=20251107",
  "cryptography>=50.0.2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
browser = ["playwright>=1.65.0"]          # script-rendered pages and screenshots (`opencrawl capture`, render: browser)
ocr = ["pytesseract>=0.3.10"]           # scanned PDFs and screenshots (needs the tesseract program)
transcribe = ["faster-whisper>=1.2.1"]    # local transcription of posted recordings
all = ["playwright>=1.65.0", "pytesseract>=0.3.10"]
dev = ["pytest>=9.2.0", "reportlab>=5.1.0"]

[project.scripts]
opencrawl = "opencrawl.cli:main"

[tool.setuptools.packages.find]
include = ["opencrawl*"]
exclude = ["opencrawl.examples*", "opencrawl.templates*"]

[tool.setuptools.package-data]
opencrawl = ["templates/*/*", "examples/*/*", "examples/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
