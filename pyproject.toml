[project]
name = "opencrawl"
version = "1.0.0"
description = "A polite, resumable crawler for any list of websites, organizations or causes, with optional civic (government) and subject-research modules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0", "PyYAML>=6.0", "Pillow>=10.0",
                "pytesseract>=0.3.10", "pdfplumber>=0.11", "playwright>=1.44"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
opencrawl = "opencrawl.cli:main"

[tool.setuptools.packages.find]
include = ["opencrawl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
