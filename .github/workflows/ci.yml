name: ci

# Tests, the ReDoS audit and the settings check on every push and pull request. Read-only; no secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13"}
      - name: Install
        run: |
          sudo apt-get install -y -qq tesseract-ocr || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr)
          pip install -q --only-binary=:all: -r requirements.txt -r requirements-dev.txt
      - name: Tests
        env:
          OPENCRAWL_BROWSER_CHANNEL: chrome
        run: python -m pytest -q -p no:cacheprovider
      - name: Regular expressions against catastrophic backtracking
        run: python scripts/redos_audit.py --seconds 3
      - name: Starter project passes the settings check
        run: |
          python -m opencrawl init "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project" && python -m opencrawl doctor --browser
        env:
          OPENCRAWL_BROWSER_CHANNEL: chrome
